name: codelimit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Run CodeLimit
      uses: getcodelimit/codelimit-action@v1
